<!DOCTYPE html>
<html>
<head>
    <title>Historical Imagery V3 - Interactive Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 10px 20px; background: #333; color: white; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        #main-container { display: flex; flex: 1; overflow: hidden; }
        #map { flex: 1; background: #ddd; }
        #sidebar { width: 350px; background: white; padding: 15px; border-left: 1px solid #ccc; overflow-y: auto; display: flex; flex-direction: column; }
        h1 { font-size: 1.1rem; margin: 0; }
        .region-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .region-item:hover { background: #f9f9f9; }
        .region-item.active { background: #e0f0ff; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { text-align: left; padding: 6px; border-bottom: 1px solid #eee; }
        th { background: #fafafa; position: sticky; top: 0; }
        .metadata-row { cursor: pointer; }
        .metadata-row:hover { background: #f0f8ff; }
        .metadata-row.active { background: #d0e8ff; font-weight: bold; }
        .copy-btn { 
            background: #eee; border: 1px solid #ccc; border-radius: 3px; 
            cursor: pointer; padding: 2px 5px; font-size: 0.7rem; margin-left: 5px;
        }
        .copy-btn:hover { background: #ddd; }
        .copy-btn:active { background: #bbb; }
        .status-bar { font-size: 0.75rem; background: #eee; padding: 5px 20px; border-bottom: 1px solid #ccc; }
        .controls { margin-bottom: 15px; }
        .refresh-btn { background: #4caf50; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        #date-list-container { flex: 1; overflow-y: auto; border: 1px solid #eee; margin-top: 10px; }
        
        /* noUiSlider Customization */
        #timeline-container { background: #444; padding: 20px 40px 45px 40px; display: none; }
        .noUi-pips-horizontal { color: #ccc; font-size: 10px; }
        .noUi-value-horizontal { transform: translate(-50%, 15px); }
        .noUi-marker-horizontal.noUi-marker-large { background: #888; height: 10px; }
        #timeline-current { color: white; font-weight: bold; margin-bottom: 10px; display: block; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>Historical V3: Interactive Map Explorer</h1>
        <button class="refresh-btn" onclick="refreshDbRoot()">Refresh dbRoot</button>
    </header>
    <div class="status-bar" id="status-bar">
        Zoom to 14+ to see available dates for the center of the map.
        <span id="global-status" style="float:right"></span>
    </div>
    <div id="timeline-container">
        <span id="timeline-current">Select a date</span>
        <div id="timeline-slider"></div>
    </div>
    <div id="main-container">
        <div id="map">
            <div id="zoom-indicator" style="position: absolute; bottom: 20px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.7); color: #0f0; padding: 5px 10px; border-radius: 5px; font-family: monospace; font-size: 14px; pointer-events: none; border: 1px solid #333;">
                ZOOM: 14.0
            </div>
        </div>
        <div id="sidebar">
            <div class="controls">
                <h3>Predefined Shortcuts</h3>
                <div id="regions-list"></div>
            </div>
            <h3>Available Dates (Z14+)</h3>
            <div id="date-list-container">
                <table id="metadata-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>v.</th>
                            <th>Token</th>
                        </tr>
                    </thead>
                    <tbody id="metadata-body">
                        <tr><td colspan="3">Zoom in or select a shortcut</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="loading-indicator" style="display:none; color: blue; font-size: 0.8rem; margin-top: 5px;">Loading metadata...</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
