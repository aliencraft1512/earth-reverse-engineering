<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Earth Historical Imagery Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #eef2f7;
            color: #162133;
        }

        #map {
            flex: 1 1 auto;
            min-height: 100vh;
        }

        #sidebar {
            width: 360px;
            background: linear-gradient(180deg, #fbfcfe 0%, #eef3f8 100%);
            border-left: 1px solid #d6deea;
            padding: 18px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.2rem;
        }

        .panel {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid #d6deea;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 10px 28px rgba(20, 35, 60, 0.05);
        }

        .scroll-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        #status {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        #status[data-tone="ok"] {
            color: #0a5c32;
        }

        #status[data-tone="warn"] {
            color: #8c4f00;
        }

        #status[data-tone="error"] {
            color: #9d1f1f;
        }

        .verification-line,
        #selectionStatus {
            font-size: 0.82rem;
            line-height: 1.5;
            color: #4a5b72;
        }

        .path-debug-card {
            border: 1px solid #d3dceb;
            border-radius: 8px;
            background: #f8fbff;
            margin-top: 8px;
            padding: 8px 10px;
        }

        .path-debug-summary {
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            color: #24364f;
        }

        .path-debug-line,
        .path-debug-tuple,
        .path-debug-more,
        .path-debug-empty,
        .path-debug-tuples-label {
            font-size: 0.76rem;
            line-height: 1.45;
            color: #50627a;
            margin-top: 6px;
            overflow-wrap: anywhere;
        }

        .path-debug-tuples-label {
            font-weight: 600;
            color: #24364f;
        }

        .path-debug-tuples {
            display: grid;
            gap: 4px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        #entriesPanel {
            flex: 1 1 40%;
        }

        #pathDebugPanel {
            flex: 1 1 45%;
        }

        #dateList,
        #pathDebugList {
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding-right: 4px;
        }

        #dateList {
            display: flex;
            flex-direction: column;
            min-height: 220px;
        }

        #pathDebugList {
            min-height: 180px;
        }

        .date-item {
            width: 100%;
            text-align: left;
            padding: 11px 12px;
            border: 1px solid #c8d4e4;
            border-radius: 10px;
            background: #ffffff;
            cursor: pointer;
            margin-bottom: 8px;
            transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
        }

        .date-item:hover {
            transform: translateY(-1px);
            border-color: #6f8fb7;
            box-shadow: 0 8px 22px rgba(33, 56, 92, 0.12);
        }

        .date-item.active {
            border-color: #2f5f9b;
            background: linear-gradient(180deg, #e6f0fb 0%, #dbe8f6 100%);
        }

        .date-item.empty {
            cursor: default;
            box-shadow: none;
            transform: none;
        }

        .date-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .date-meta {
            font-size: 0.78rem;
            color: #5f7087;
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }

            #sidebar {
                width: 100%;
                min-height: 42vh;
                border-left: 0;
                border-top: 1px solid #d6deea;
                height: auto;
                overflow: visible;
            }

            #map {
                min-height: 58vh;
            }

            #dateList,
            #pathDebugList {
                max-height: 38vh;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <aside id="sidebar">
        <h1>Historical Bounds Catalog</h1>
        <div class="panel">
            <div id="status">Move the map to verify historical metadata for the current bounds.</div>
        </div>
        <div class="panel">
            <div class="toggle-row">
                <input id="preferExactVersion" type="checkbox" checked />
                <label for="preferExactVersion">Prefer the selected iCode when it is valid</label>
            </div>
            <div id="selectionStatus">No historical entry selected.</div>
        </div>
        <div class="panel">
            <strong>Verification</strong>
            <div id="verificationSummary"></div>
        </div>
        <div class="panel scroll-panel" id="entriesPanel">
            <strong>Visible Entries</strong>
            <div id="dateList"></div>
        </div>
        <div class="panel scroll-panel" id="pathDebugPanel">
            <strong>Visible Paths Debug</strong>
            <div id="pathDebugList"></div>
        </div>
    </aside>
    <script src="selection.js"></script>
    <script src="app.js"></script>
</body>
</html>
