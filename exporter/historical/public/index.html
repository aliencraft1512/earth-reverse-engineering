
<!DOCTYPE html>
<html>
<head>
    <title>Google Earth Historical Imagery Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; display: flex; height: 100vh; }
        #map { flex-grow: 1; }
        #sidebar { width: 300px; background: #f8f9fa; border-left: 1px solid #ddd; padding: 15px; overflow-y: auto; }
        h2 { margin-top: 0; font-size: 1.2rem; }
        .date-item { 
            padding: 8px; border: 1px solid #ccc; margin-bottom: 5px; cursor: pointer; border-radius: 4px; background: white;
        }
        .date-item:hover { background: #e9ecef; }
        .date-item.active { background: #007bff; color: white; border-color: #0056b3; }
        #status { font-size: 0.8rem; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="sidebar">
        <h2>Historical Dates</h2>
        <div id="status">Pan/Zoom to update</div>
        <div id="dateList"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
